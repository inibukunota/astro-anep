name: TinaCMS initialization test

on:
  push:
    branches:
      - chore/tina-init-test
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tina-init:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/tina-init-test
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run TinaCMS init
        run: npx @tinacms/cli@latest init

      - name: Show Tina changes
        run: |
          echo "=== Git status ==="
          git status --short
          echo "=== Tina files ==="
          find tina -maxdepth 2 -type f -print 2>/dev/null || true
          echo "=== Tina config ==="
          if [ -f tina/config.ts ]; then sed -n '1,240p' tina/config.ts; fi
          echo "=== Diff ==="
          git diff -- package.json package-lock.json tina .gitignore

      - name: Commit Tina initialization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json tina .gitignore
          if git diff --cached --quiet; then
            echo "No changes produced by Tina init."
          else
            git commit -m "Test TinaCMS CLI initialization"
            git push origin chore/tina-init-test
          fi
